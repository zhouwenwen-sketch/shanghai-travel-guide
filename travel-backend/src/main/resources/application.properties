# The URL defaults to the local development database. Database credentials must
# always be injected through DB_USERNAME/DB_PASSWORD; never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
server.port=8081

# Security secrets must be injected by the environment. JWT_SECRET must contain
# at least 32 characters. Never commit a production secret to this file.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.ttl=${JWT_TTL:PT2H}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Include the server-generated request trace ID in every application log line.
# Client-supplied X-Request-Id values are never trusted or reused.
logging.pattern.level=%5p [traceId:%X{traceId:-none}]

# Flyway is the only schema/data initializer. Existing unversioned databases must
# be audited and migrated explicitly with the opt-in legacy profile.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
